<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Me</title>
        <script>
            try {
                document.documentElement.dataset.theme =
                    localStorage.getItem("theme") === "light" ? "light" : "dark";
            } catch (e) {}
        </script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="bento page contact-page">
            <div class="bar">
                <a class="cell" href="index.html">
                    <span class="label">← Home</span>
                </a>
                <button class="cell toggle" type="button" aria-label="Switch color theme">◐</button>
            </div>

            <section class="contact">
                <a class="cell contact-link" href="mailto:diparsan@fl4me.tech">
                    <span class="label">Email</span>
                    <span class="tagline">diparsan@fl4me.tech</span>
                </a>
                <a class="cell contact-link" href="https://github.com/Diparsan79" target="_blank" rel="noopener noreferrer">
                    <span class="label">Github</span>
                    <span class="tagline">Diparsan79</span>
                </a>
                <a class="cell contact-link" href="https://linkedin.com/in/diparsan-pathak/" target="_blank" rel="noopener noreferrer">
                    <span class="label">LinkedIn</span>
                    <span class="tagline">diparsan-pathak</span>
                </a>
                <a class="cell contact-link" href="https://letterboxd.com/flamexgod" target="_blank" rel="noopener noreferrer">
                    <span class="label">Letterboxd</span>
                    <span class="tagline">flamexgod</span>
                </a>
                <a class="cell contact-link" href="https://www.last.fm/user/flamex67" target="_blank" rel="noopener noreferrer">
                    <span class="label">Last.fm</span>
                    <span class="tagline">flamex67</span>
                </a>
            </section>
        </main>
        <script src="script.js" defer></script>
    </body>
</html>
